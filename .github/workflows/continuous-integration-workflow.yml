name: Continuous Integration Build

on:
  workflow_dispatch:  # Allow manual triggers
  pull_request:
    branches: [ master ]
  #push:
  #  branches: [ master ]

jobs:
  ubuntu-build:
    name: Ubuntu · legacy renderer ${{ matrix.legacy_renderer.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        legacy_renderer:
          - value: 'ON'
            label: enabled
          - value: 'OFF'
            label: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install freeglut3-dev
      - name: Build and test
        run: .github/scripts/build-and-test.sh "${{ matrix.legacy_renderer.value }}"
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Ubuntu-Artifacts-LegacyGL-${{ matrix.legacy_renderer.value }}
          path: cmake_install_dir/
        if: always()

  windows-build:
    name: Windows · legacy renderer ${{ matrix.legacy_renderer.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        legacy_renderer:
          - value: 'ON'
            label: enabled
          - value: 'OFF'
            label: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and test
        shell: pwsh
        run: .github/scripts/build-and-test.ps1 -LegacyRenderer "${{ matrix.legacy_renderer.value }}"
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Artifacts-LegacyGL-${{ matrix.legacy_renderer.value }}
          path: cmake_install_dir/
        if: always()

  windows-feature-closure:
    name: Windows · ${{ matrix.features.label }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        features:
          - label: VRML97 without JavaScript
            vrml97: 'ON'
            javascript: 'OFF'
          - label: without VRML97
            vrml97: 'OFF'
            javascript: 'OFF'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Configure feature closure
        shell: pwsh
        run: >-
          cmake -S . -B cmake_feature_build -G "Visual Studio 17 2022" -A x64
          -DCOIN_BUILD_TESTS=OFF
          -DHAVE_VRML97=${{ matrix.features.vrml97 }}
          -DCOIN_HAVE_JAVASCRIPT=${{ matrix.features.javascript }}
      - name: Build Coin
        run: cmake --build cmake_feature_build --target Coin --config Release --parallel 2

  macos-build:
    name: macOS · legacy renderer ${{ matrix.legacy_renderer.label }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        legacy_renderer:
          - value: 'ON'
            label: enabled
          - value: 'OFF'
            label: disabled
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build and test
        run: .github/scripts/build-and-test.sh "${{ matrix.legacy_renderer.value }}"
      - name: Create Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MacOS-Artifacts-LegacyGL-${{ matrix.legacy_renderer.value }}
          path: cmake_install_dir/
        if: always()
